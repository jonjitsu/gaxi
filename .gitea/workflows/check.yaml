name: check

# A branch push and its pull request are the same commit, so an unfiltered
# `push` ran every job twice: once for the branch, once for the pull request,
# and again for any tag. Branch work is gated by `pull_request`; `push` covers
# master, where there is no pull request to stand in for it.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Sync the development environment
        run: uv sync --all-groups --frozen
      - name: Quality gates
        run: uv run invoke verify

  live-compatibility:
    name: Live instance compatibility
    runs-on: ubuntu-latest
    services:
      gitea:
        image: gitea/gitea:1.27
        env:
          GITEA__security__INSTALL_LOCK: "true"
          GITEA__server__ROOT_URL: http://gitea:3000/
          GITEA__server__LFS_START_SERVER: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Sync the development environment
        run: uv sync --all-groups --frozen
      - name: Wait for the ephemeral instance
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://gitea:3000/api/v1/version && exit 0
            sleep 2
          done
          echo "instance did not start" >&2
          exit 1
      - name: Compile the live catalog
        env:
          GAXI_TEST_SERVER: http://gitea:3000
          GAXI_CACHE_HOME: ${{ gitea.workspace }}/.gaxi-cache
        run: uv run pytest tests/gaxi/integration

  nix:
    name: Nix package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build the package
        run: nix build .#gaxi -L
      - name: Run the built executable
        run: ./result/bin/gaxi --help
      # Evaluation only: this proves every flake output still evaluates —
      # including the devshell, which `nix build` never touches — without
      # realising the devshell's closure. `dev/` is a separate flake and is
      # deliberately out of scope, since it needs the private toolbox.
      - name: Evaluate the flake outputs
        run: nix flake check --no-build
