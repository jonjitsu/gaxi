name: compatibility-scheduled

on:
  schedule:
    # Weekly Monday 06:00 UTC — optional drift check against newer Gitea releases.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-compatibility:
    name: Live instance compatibility (${{ matrix.gitea_tag }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gitea_tag:
          - "1.27"
          - latest
    services:
      gitea:
        image: gitea/gitea:${{ matrix.gitea_tag }}
        env:
          GITEA__security__INSTALL_LOCK: "true"
          GITEA__server__ROOT_URL: http://gitea:3000/
          GITEA__server__LFS_START_SERVER: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Sync the development environment
        run: uv sync --all-groups --frozen
      - name: Wait for the ephemeral instance
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://gitea:3000/api/v1/version && exit 0
            sleep 2
          done
          echo "instance did not start" >&2
          exit 1
      - name: Compile the live catalog
        env:
          GAXI_TEST_SERVER: http://gitea:3000
          GAXI_CACHE_HOME: ${{ gitea.workspace }}/.gaxi-cache
        run: uv run pytest tests/gaxi/integration
